<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合阳木偶 · 脸谱工坊</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <p class="hero-kicker">合阳提线木偶戏 · 国家级非物质文化遗产</p>
    <h1>合阳木偶 · 脸谱工坊</h1>
    <p class="hero-sub">西安理工大学线迹捕手社会实践队出品</p>
    <nav class="hero-tabs">
      <button class="tab active" data-tab="maker">拼脸工坊</button>
      <button class="tab" data-tab="gallery">脸谱图鉴（38式）</button>
    </nav>
  </div>
</header>

<main>
  <!-- ============ 拼脸工坊 ============ -->
  <section id="maker" class="panel active">
    <div class="maker">
      <div class="side-rail">
        <button class="rail-btn" id="btnRandom" title="随机">🎲</button>
        <button class="rail-btn" id="btnReset" title="返回上一个脸谱">↺</button>
      </div>

      <div class="stage">
        <div class="stage-card">
          <div id="faceBox"></div>
          <div class="stage-actions">
            <button id="btnPng" class="pill pill-dark">下载 PNG</button>
            <button id="btnSvg" class="pill">下载 SVG</button>
          </div>
        </div>
      </div>

      <aside class="controls" id="controls"></aside>
    </div>
  </section>

  <!-- ============ 脸谱图鉴 ============ -->
  <section id="gallery" class="panel">
    <div class="gallery-top">
      <div class="filters" id="roleFilter"></div>
      <select id="colorFilter" class="color-filter">
        <option value="">全部主色</option>
      </select>
    </div>
    <div class="card-grid" id="cardGrid"></div>
    <p class="gallery-count" id="galleryCount"></p>
  </section>
</main>

<footer>
  <p>素材来源：史耀增《合阳线戏》中的线戏脸谱（王国声 绘）</p>
</footer>

<script src="data.js"></script>
<script src="faces.js"></script>
<script src="app.js"></script>
</body>
</html>
